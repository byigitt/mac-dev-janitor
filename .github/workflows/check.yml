name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install shellcheck
      - run: shellcheck bin/daily-clean install.sh uninstall.sh
      - run: /usr/bin/python3 -m py_compile bin/resource-watchdog
      - run: bin/resource-watchdog --dry-run --once
      - run: ./install.sh --no-load --agent-rules
        env:
          HOME: ${{ runner.temp }}/home
